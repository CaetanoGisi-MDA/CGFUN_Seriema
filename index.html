<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Observatório Seriema — territórios quilombolas</title>
<meta name="description" content="Painel de governança fundiária de territórios quilombolas. Coordenação de Governança Fundiária — SETEQ/MDA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="estilo.css" rel="stylesheet">
</head>
<body>

<div id="app">

  <header>
    <div class="marca">
      <svg class="emblema" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="5" fill="#17262C"/>
        <!-- seriema estilizada: corpo, pescoço longo, crista, bico -->
        <path d="M11 31c4.5-.6 7.6-3.2 9-8 1.3-4.4 2.4-8.4 5.8-10.3" stroke="#E6E7E1" stroke-width="2.1" fill="none" stroke-linecap="round"/>
        <circle cx="27.4" cy="11.2" r="2.9" fill="#E6E7E1"/>
        <path d="M30.2 10.6 35 9.4l-4.4 2.6z" fill="#C8531F"/>
        <path d="M25.6 8.2c-.6-1.6-.2-3 .8-3.9M27.6 7.8c.2-1.7 1-2.8 2.2-3.3" stroke="#C8531F" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <path d="M14 31.5v3.2M17.5 30.6v4.1" stroke="#C8531F" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Observatório Seriema</h1>
        <div class="sub">Governança fundiária quilombola · CFU / SETEQ / MDA</div>
      </div>
    </div>
    <div class="contagem">
      <div class="bloco-n">
        <span class="rot">Territórios titulados</span>
        <div class="par"><b id="c-tit">—</b><b id="c-tit-ha">—</b></div>
        <div class="par"><span>territórios</span><span>hectares<sup>*</sup></span></div>
      </div>
      <div class="bloco-n">
        <span class="rot">Processos territoriais em curso</span>
        <div class="par"><b id="c-curso">—</b><b id="c-curso-ha">—</b></div>
        <div class="par"><span>processos</span><span>hectares<sup>*</sup></span></div>
      </div>
      <div class="corte" id="c-corte">dados de —</div>
    </div>
  </header>

  <main>
    <section id="mapa">
      <div class="camadas">
        <button class="recolher" id="bt-recolher" aria-expanded="true" title="Recolher painel de camadas">−</button>
      <div class="titulo">Universo</div>
      <div class="universo" id="universo">
        <button data-u="federal"    aria-pressed="true">Federal <span class="n"></span></button>
        <button data-u="estadual"   aria-pressed="false">Estadual <span class="n"></span></button>
        <button data-u="certidoes"  aria-pressed="false">Certificadas s/ processo <span class="n"></span></button>
        <button data-u="todos"      aria-pressed="false">Todos <span class="n"></span></button>
      </div>
      <div class="titulo" style="margin-top:8px">Camadas — fase do processo</div>
        <div class="chips" id="chips-fase"></div>
        <div class="titulo" style="margin-top:8px">Filtros</div>
        <div class="chips" id="chips-extra">
          <button class="chip" data-filtro="protocolo" aria-pressed="false"><span class="pt" style="background:var(--bico)"></span>Com protocolo <span class="n" id="n-prot"></span></button>
          <button class="chip" data-filtro="poligono" aria-pressed="false"><span class="pt" style="background:var(--tinta-2)"></span>Com polígono <span class="n" id="n-pol"></span></button>
          <button class="chip" data-filtro="estadual" aria-pressed="false"><span class="pt" style="background:var(--fx)"></span>Esfera estadual <span class="n" id="n-est"></span></button>
        </div>
      </div>
    </section>

    <aside id="painel">
      <div class="abas" role="tablist">
        <button class="aba" role="tab" aria-selected="true"  data-aba="lista">Territórios</button>
        <button class="aba" role="tab" aria-selected="false" data-aba="ia">Assistente</button>
        <button class="aba" role="tab" aria-selected="false" data-aba="sobre">Fontes</button>
      </div>

      <!-- barra de busca (só na aba lista) -->
      <div class="buscabar" id="buscabar">
        <input id="busca" type="search" placeholder="Buscar por nome, município ou nº de processo" autocomplete="off">
        <select id="filtro-uf"><option value="">UF</option></select>
        <span class="contador" id="contador">—</span>
      </div>

      <!-- ABA LISTA -->
      <div class="conteudo" id="painel-lista"></div>

      <!-- ABA ASSISTENTE -->
      <div class="ia oculto" id="painel-ia">
        <div class="ia-fluxo" id="ia-fluxo"></div>
        <div class="ia-entrada">
          <textarea id="ia-txt" rows="1" placeholder="Pergunte sobre os dados, ou peça uma correção na base…"></textarea>
          <button class="bt" id="ia-enviar">Perguntar</button>
        </div>
      </div>

      <!-- ABA FONTES -->
      <div class="conteudo oculto" id="painel-sobre"></div>

      <!-- rodapé de edições pendentes -->
      <div class="pendentes oculto" id="pendentes">
        <b id="pend-n">0</b>
        <span>edições confirmadas, ainda não publicadas</span>
        <button class="bt p laranja" id="bt-publicar" style="margin-left:auto">Publicar</button>
      </div>
    </aside>
  </main>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="config.js"></script>
<script src="seriema.js"></script>
<script src="assistente.js"></script>
<script>Seriema.iniciar();</script>
</body>
</html>
